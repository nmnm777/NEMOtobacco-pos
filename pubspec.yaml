name: tobacco_pos
description: A Tobacco POS Flutter application (demo)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  sqflite: ^2.2.8+4
  path_provider: ^2.0.15
  printing: ^5.10.0
  pdf: ^3.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/seed_data.json
    - assets/products.json
    - assets/sales.json
    - assets/fonts/Amiri-Regular.ttf
